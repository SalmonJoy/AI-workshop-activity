server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 204;
  }

  location = /workshop {
    return 404;
  }

  location = /workshop/ {
    return 404;
  }

  location /workshop/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location = /workshop/presentation/workshop-presentation.pdf {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /workshop/activity {
    try_files /workshop/index.html =404;
    add_header Cache-Control "no-cache" always;
  }

  location = /workshop/presentation {
    try_files /workshop/index.html =404;
    add_header Cache-Control "no-cache" always;
  }

  location = /workshop/presentation/ {
    try_files /workshop/index.html =404;
    add_header Cache-Control "no-cache" always;
  }

  location /workshop/activity/ {
    try_files $uri $uri/ /workshop/index.html =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    return 404;
  }
}
